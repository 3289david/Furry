<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#3b1d4a"/>
      <stop offset="65%" stop-color="#161829"/>
      <stop offset="100%" stop-color="#0c0a0e"/>
    </radialGradient>
    <radialGradient id="mochiGrad" cx="42%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffd5e3"/>
      <stop offset="45%" stop-color="#ff9ec7"/>
      <stop offset="90%" stop-color="#7a3b8c"/>
      <stop offset="100%" stop-color="#401952"/>
    </radialGradient>
    <filter id="furGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="270" r="150" fill="url(#mochiGrad)" filter="url(#furGlow)"/>
  <!-- Left Eye -->
  <ellipse cx="205" cy="245" rx="16" ry="24" fill="#2d1338"/>
  <circle cx="210" cy="236" r="6" fill="#ffffff"/>
  <!-- Right Eye -->
  <ellipse cx="307" cy="245" rx="16" ry="24" fill="#2d1338"/>
  <circle cx="312" cy="236" r="6" fill="#ffffff"/>
  <!-- Cheeks -->
  <ellipse cx="175" cy="275" rx="18" ry="10" fill="#f43f5e" opacity="0.45"/>
  <ellipse cx="337" cy="275" rx="18" ry="10" fill="#f43f5e" opacity="0.45"/>
  <!-- Mouth -->
  <path d="M 238 275 Q 256 289 274 275" fill="none" stroke="#2d1338" stroke-width="4.5" stroke-linecap="round"/>
</svg>
